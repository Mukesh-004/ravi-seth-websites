services:
  website:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:4173:4173"
    volumes:
      - ravi_data:/app/data
      - ravi_uploads:/app/uploads

volumes:
  ravi_data:
  ravi_uploads:
